# Local development stack. Configuration comes from environment variables
# (see .env.example); every variable has a default, so `docker compose up` works without a .env.
#
#   docker compose up -d --build                       # postgres, redis, migration, both APIs
#   docker compose run --rm settlement-batch           # one-off batch run (profile "batch")
#   SETTLEMENT_RUN_DATE=2026-01-20 docker compose run --rm settlement-batch
#   DATASET_DIR=./data/out/full docker compose up -d   # settle another dataset

name: payments-ml-data-lab

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the risk_scoring and settlement databases on the FIRST start of a volume.
      # With an existing volume run `docker compose down -v` once (this deletes local data).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the Alembic migrations of the decision log, then exits.
  risk-migrate:
    build:
      context: .
      dockerfile: services/risk-scoring-api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      RISK_DATABASE_URL: &risk-database-url postgresql+psycopg://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/risk_scoring
    depends_on:
      postgres:
        condition: service_healthy

  risk-scoring-api:
    build:
      context: .
      dockerfile: services/risk-scoring-api/Dockerfile
    environment:
      RISK_APP_VERSION: ${RISK_APP_VERSION:-0.1.0}
      RISK_LOG_LEVEL: ${RISK_LOG_LEVEL:-INFO}
      RISK_DATABASE_URL: *risk-database-url
      RISK_TORCH_THREADS: ${RISK_TORCH_THREADS:-1}
      # Uvicorn workers: inference is CPU-bound, so scale with processes, not threads.
      WEB_CONCURRENCY: ${RISK_WEB_CONCURRENCY:-1}
    ports:
      - "${RISK_API_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      risk-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: applies the Alembic migrations of the `runs` table, then exits.
  settlement-migrate:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      SETTLEMENT_DATABASE_URL: &settlement-database-url postgresql+psycopg://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/settlement
    depends_on:
      postgres:
        condition: service_healthy

  # Read-mostly API: reads the marts (read-only mount) and registers runs in Postgres.
  settlement-service-api:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    environment:
      SETTLEMENT_APP_VERSION: ${SETTLEMENT_APP_VERSION:-0.1.0}
      SETTLEMENT_LOG_LEVEL: ${SETTLEMENT_LOG_LEVEL:-INFO}
      SETTLEMENT_DATABASE_URL: *settlement-database-url
    ports:
      - "${SETTLEMENT_API_PORT:-8002}:8000"
    volumes:
      - settlement-marts:/data/marts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as the API, different command: executes the runs the API registered. It is the only
  # writer of the marts volume. SIGTERM lets the current run finish, so give it time to do so.
  settlement-worker:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    command: ["python", "-m", "settlement.batch", "worker"]
    environment:
      SETTLEMENT_LOG_LEVEL: ${SETTLEMENT_LOG_LEVEL:-INFO}
      SETTLEMENT_DATABASE_URL: *settlement-database-url
      SETTLEMENT_WORKER_POLL_SECONDS: ${SETTLEMENT_WORKER_POLL_SECONDS:-2}
      SETTLEMENT_STALE_AFTER_SECONDS: ${SETTLEMENT_STALE_AFTER_SECONDS:-900}
      SETTLEMENT_MAX_ATTEMPTS: ${SETTLEMENT_MAX_ATTEMPTS:-3}
    volumes:
      - settlement-marts:/data/marts
      # The dataset root (reference/ and settlement/), read-only. Default: the committed sample.
      - ${DATASET_DIR:-./data/samples}:/data/input:ro
    stop_grace_period: 2m
    healthcheck:
      disable: true  # the image's HEALTHCHECK probes the API's /ready; the worker serves no HTTP
    depends_on:
      settlement-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Ad-hoc run that bypasses the queue (ops and backfills). Not started by default.
  settlement-batch:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    command: ["python", "-m", "settlement.batch", "run", "--date", "${SETTLEMENT_RUN_DATE:-2026-01-15}"]
    environment:
      SETTLEMENT_LOG_LEVEL: ${SETTLEMENT_LOG_LEVEL:-INFO}
    volumes:
      - settlement-marts:/data/marts
      - ${DATASET_DIR:-./data/samples}:/data/input:ro
    healthcheck:
      disable: true

volumes:
  postgres-data:
  settlement-marts:
