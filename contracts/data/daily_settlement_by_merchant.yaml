name: daily_settlement_by_merchant
version: 1
description: >-
  Mart produced by the settlement batch (Phase 4). The ledger-expected payout: what the platform
  owes each merchant for a settlement date, from the expected SALE, REFUND and CHARGEBACK records due
  that day. It is not what the PSP confirmed (differences are in reconciliation_breaks). One row
  per settlement date, merchant and currency. All amounts are positive magnitudes in minor units
  and net_minor = gross - fee - refunds - chargebacks. Hive-partitioned by settlement_date.
primary_key: [settlement_date, merchant_id, currency]
columns:
  - name: settlement_date
    type: date
    nullable: false
    role: id
    description: Day the money moves.
  - name: merchant_id
    type: string
    nullable: false
    role: id
    description: Foreign key to merchants.merchant_id.
    constraints: { pattern: "^mer_[0-9a-f]{6}$" }
  - name: currency
    type: string
    nullable: false
    role: id
    description: ISO 4217 currency. Only BRL for now.
    constraints: { accepted_values: [BRL] }
  - name: payment_count
    type: int64
    nullable: false
    role: metadata
    description: Number of expected SALE records due on the settlement date.
    constraints: { min: 0 }
  - name: gross_minor
    type: int64
    nullable: false
    role: metadata
    description: Sum of the amounts of the SALEs due (CAPTURED payments).
    constraints: { min: 0 }
  - name: fee_minor
    type: int64
    nullable: false
    role: metadata
    description: Sum of the contracted fees of those SALEs (round half up on mdr_bps).
    constraints: { min: 0 }
  - name: refunds_minor
    type: int64
    nullable: false
    role: metadata
    description: Sum of the refund amounts due on the settlement date.
    constraints: { min: 0 }
  - name: chargebacks_minor
    type: int64
    nullable: false
    role: metadata
    description: >-
      Sum of the chargeback amounts due on the settlement date. The flat PSP chargeback fee is
      absorbed by the platform and is not included.
    constraints: { min: 0 }
  - name: net_minor
    type: int64
    nullable: false
    role: metadata
    description: gross_minor - fee_minor - refunds_minor - chargebacks_minor; can be negative.
rules:
  - { name: net_is_consistent, expr: "net_minor = gross_minor - fee_minor - refunds_minor - chargebacks_minor" }
