[project]
name = "risk-scoring-api"
version = "0.1.0"
description = "Online fraud scoring API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "payments-shared",
]

[tool.uv.sources]
payments-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_scoring"]
