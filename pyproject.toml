[project]
name = "payments-ml-data-lab"
version = "0.1.0"
description = "Portfolio monorepo: online fraud scoring and batch settlement for a synthetic payments system."
requires-python = ">=3.12"
dependencies = []

# Virtual workspace root: not a buildable/published package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

# CPU-only torch wheels on Linux (CI, Docker): the default PyPI wheels pull in multi-GB CUDA libs.
# On macOS the regular PyPI wheel is already CPU/MPS only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["payments_shared", "payments_datagen", "risk_scoring", "settlement"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [
    "packages/shared/tests",
    "packages/datagen/tests",
    "services/risk-scoring-api/tests",
    "services/settlement-service/tests",
]
addopts = "-q --import-mode=importlib"
