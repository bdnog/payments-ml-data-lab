[project]
name = "payments-datagen"
version = "0.1.0"
description = "Deterministic synthetic data generator: one coherent universe for risk and settlement."
requires-python = ">=3.12"
dependencies = [
    "payments-shared",
    "polars>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
payments-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_datagen"]
