name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # The SQL repository tests (decision log, Alembic migration, concurrency) run against this.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: risk_scoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d risk_scoring_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RISK_TEST_DATABASE_URL: postgresql+psycopg://payments:payments@localhost:5432/risk_scoring_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Check that the exported OpenAPI contracts are up to date
        run: make contracts-check

      - name: Generate the sample profile and validate it
        run: |
          uv run python -m payments_datagen generate --profile sample --out "${{ runner.temp }}/sample"
          uv run python -m payments_datagen validate "${{ runner.temp }}/sample"

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [risk-scoring-api, settlement-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
